# Bundled defaults for the "strict" profile. Loaded from the package, lowest
# precedence tier. User configuration is validated against the same schema and
# merged over these values; lists replace, tables merge key by key.

[tool.shockharness]
profile = "strict"
include = ["**/*.py", "**/*.js", "**/*.mjs", "**/*.cjs"]
exclude = ["**/.git/**", "**/node_modules/**", "**/.venv/**", "**/venv/**", "**/dist/**", "**/build/**", "**/generated/**", "**/__pycache__/**"]
parse_errors = "fail"
follow_symlinks = false
overrides = []

[tool.shockharness.rules.magic_numbers]
enabled = true
allowed_values = [0, 1]
allow_unary_negative_one = false
exclude_configuration_files = true
# Basenames (or path globs) that are tooling configuration rather than application
# source. Matching files are exempt from MAGIC001 and listed in the report.
configuration_files = [
  "conftest.py",
  "setup.py",
  "*.config.js",
  "*.config.mjs",
  "*.config.cjs",
  "*.conf.js",
  "*.conf.cjs",
  ".eslintrc.js",
  ".eslintrc.cjs",
  ".prettierrc.js",
  ".prettierrc.cjs",
  "gulpfile.js",
  "Gruntfile.js",
]

[tool.shockharness.rules.magic_strings]
enabled = true
mode = "review"

[tool.shockharness.rules.exceptions]
enabled = true
mode = "boundary_whitelist"
# When true, a handler that only re-raises the caught exception (bare `raise`,
# `raise err`, `throw err`) passes EXC001 outside any boundary. Off in strict:
# wrapping and re-raising is not the same as no catch.
transparent_rethrow = false
# Each boundary approves catching exactly one qualified exception in files that
# match `path` for one language. Every entry is reported as a policy deviation.
boundaries = []

[tool.shockharness.rules.defaults]
enabled = true
# Each mode: "forbid" -> error (fails the gate), "review" -> reported, never fails,
# "allow" -> no finding. Anything looser than the strict value below is reported
# as a policy deviation.
function_parameters = "forbid"      # DEF001: def f(x=v), function f(x = v), destructured parameter defaults
dataclass_fields = "forbid"         # DEF001: x: int = v, field(default=...), field(default_factory=...) in a @dataclass
missing_value_fallbacks = "forbid"  # DEF002: m.get(k, v), getattr(o, a, v), const {x = v} = o, o?.x ?? v
truthiness_fallbacks = "review"     # DEF003: x or v, x || v (also replace legitimate falsy values)
nullish_fallbacks = "forbid"        # DEF004: x ?? v, x if x is not None else v
configuration_fallbacks = "forbid"  # DEF006: os.getenv("X", v), process.env.X || v
# DEF005 (a handler that returns a default) has no mode: it is always an error.

[tool.shockharness.complexity]
enabled = true
cognitive_warn = 15
cyclomatic_warn = 15
max_nesting_warn = 4

[tool.shockharness.gates]
new_hard_violations = "fail"
legacy = "baseline"
complexity_regressions = "warn"
