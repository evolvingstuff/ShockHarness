# Profile "minimal": every rule still runs and reports, nothing fails the gate
# except malformed suppressions (SUPP001). MAGIC001, EXC001-EXC003 and
# DEF001-DEF006 are capped at review, syntax failures are warnings, and the
# complexity family is off. Meant for first contact with a legacy codebase;
# every line below is reported as a policy deviation in every report.

[tool.shockharness]
parse_errors = "warn"
unsupported_sources = "ignore"

[tool.shockharness.rules.magic_numbers]
severity = "review"
named_constant_definitions = "allow"

[tool.shockharness.rules.exceptions]
severity = "review"

[tool.shockharness.rules.defaults]
severity = "review"

[tool.shockharness.complexity]
enabled = false        # CPLX001-CPLX006 off; metrics.complexity and metrics.graph say "disabled"
