name: CI

on:
  push:
    branches: [main]
  pull_request:
  # publish.yml runs this whole workflow before building a release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts evals
          ruff format --check src tests scripts evals
      - name: Tests
        run: pytest -q
      - name: Self-compliance gate
        run: shockharness check src tests scripts evals --format text
      - name: Config validates
        run: shockharness config validate
      - name: Version subcommand
        run: shockharness version

  package:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/shockharness --version
          /tmp/clean/bin/shockharness version
          /tmp/clean/bin/shockharness rules list
          /tmp/clean/bin/shockharness skills list
          unzip -l dist/*.whl | grep -c 'shockharness/skills/.*/SKILL.md' | grep -qx 4
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  consumer-examples:
    name: consumer examples (local wheel, upgrade check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel under test
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Fetch the wheel's runtime dependencies into a wheelhouse
        # The only network access of this job. The examples themselves are installed
        # from dist/ with --no-index, so the PyPI release can never stand in for the
        # checkout under test.
        run: python -m pip download --dest wheelhouse dist/shockharness-*.whl
      - name: Pinned install, clean gate, violation, failing gate (both examples)
        run: >
          python scripts/consumer_upgrade_check.py
          --dist dist --examples examples --wheelhouse wheelhouse

  skill-evals:
    name: skill eval corpus (reference solutions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Score the reference solutions (every task must pass)
        run: python evals/run_evals.py --reference --output scorecard.json
      - name: Skills install round trip (claude, codex, generic) and drift check
        run: |
          mkdir /tmp/fresh && cd /tmp/fresh
          shockharness skills install --agent claude
          shockharness skills install --agent codex
          shockharness skills install --agent generic --project agent-skills
          shockharness skills update --agent claude --check
          shockharness skills update --agent codex --check
          shockharness skills update --agent generic --project agent-skills --check
      - uses: actions/upload-artifact@v4
        with:
          name: skill-evals-scorecard
          path: scorecard.json
