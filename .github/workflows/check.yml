name: ShockHarness check (reusable)

# Reusable workflow for consumer repositories (spec section 20, decision 4 of the
# distribution brief). Call it with `uses:` pinned to a release tag or a full commit
# SHA. The analyzer version is NOT implied by that ref: it is the required
# `shockharness-version` input, installed from PyPI. See docs/integration.md.

on:
  workflow_call:
    inputs:
      shockharness-version:
        description: "Exact shockharness version to install from PyPI (the analyzer pin)"
        required: true
        type: string
      config:
        description: "Configuration file path; empty discovers it in the repository root"
        required: false
        type: string
        default: ""
      base:
        description: "Base git ref: when set, runs `gate --base <base> --head HEAD`; when empty, runs `check .`"
        required: false
        type: string
        default: ""
      python-version:
        description: "Python used to run the analyzer (the analyzed code need not be Python)"
        required: false
        type: string
        default: "3.12"
      policy-repository:
        description: "owner/name of a separate repository holding the organization's policy file; empty for none. It is cloned outside the workspace, where the change under review cannot edit it, and passed as --policy"
        required: false
        type: string
        default: ""
      policy-ref:
        description: "Branch or tag of policy-repository (git clone --branch does not take a commit)"
        required: false
        type: string
        default: "main"
      policy-path:
        description: "Path of the policy file inside policy-repository"
        required: false
        type: string
        default: "shockharness-policy.toml"
    secrets:
      policy-token:
        description: "Token that can read policy-repository when it is private"
        required: false

jobs:
  shockharness:
    name: shockharness ${{ inputs.shockharness-version }}
    runs-on: ubuntu-latest
    # The only permissions this workflow needs. The caller's job must grant at least these.
    permissions:
      contents: read
      security-events: write
    env:
      SHOCKHARNESS_VERSION: ${{ inputs.shockharness-version }}
      SHOCKHARNESS_CONFIG: ${{ inputs.config }}
      SHOCKHARNESS_BASE: ${{ inputs.base }}
      POLICY_REPOSITORY: ${{ inputs.policy-repository }}
      POLICY_REF: ${{ inputs.policy-ref }}
      POLICY_PATH: ${{ inputs.policy-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `gate --base` needs the base commit; a shallow clone would not have it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install the pinned analyzer
        run: python -m pip install --disable-pip-version-check "shockharness==${SHOCKHARNESS_VERSION}"
      - name: Fetch the organization policy (outside the workspace)
        if: ${{ inputs.policy-repository != '' }}
        env:
          POLICY_TOKEN: ${{ secrets.policy-token }}
        run: |
          url="https://github.com/${POLICY_REPOSITORY}.git"
          if [ -n "${POLICY_TOKEN}" ]; then
            url="https://x-access-token:${POLICY_TOKEN}@github.com/${POLICY_REPOSITORY}.git"
          fi
          git clone --quiet --depth 1 --branch "${POLICY_REF}" "${url}" "${RUNNER_TEMP}/shockharness-policy"
      - name: Run shockharness
        run: |
          args=(--format sarif --output shockharness.sarif)
          if [ -n "${SHOCKHARNESS_CONFIG}" ]; then
            args+=(--config "${SHOCKHARNESS_CONFIG}")
          fi
          if [ -n "${POLICY_REPOSITORY}" ]; then
            args+=(--policy "${RUNNER_TEMP}/shockharness-policy/${POLICY_PATH}")
          fi
          if [ -n "${SHOCKHARNESS_BASE}" ]; then
            shockharness gate --base "${SHOCKHARNESS_BASE}" --head HEAD "${args[@]}"
          else
            shockharness check . "${args[@]}"
          fi
      - name: Upload SARIF to code scanning
        # The report is written even when the gate fails (exit 1); it is absent only when
        # the run could not start (exit 2: invalid configuration or invocation).
        if: ${{ !cancelled() && hashFiles('shockharness.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: shockharness.sarif
          category: shockharness
