name: Publish to PyPI

# Tag-triggered release (spec section 20, decision 9): pushing a tag `vX.Y.Z` runs the
# full CI workflow, builds the wheel and sdist, checks that the tag equals the package
# version, and publishes through PyPI trusted publishing. No API token is stored
# anywhere; the `pypi` environment and the OIDC `id-token` permission are the whole
# credential. One-time setup and the per-release steps: docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: full test matrix
    uses: ./.github/workflows/ci.yml

  build:
    name: build and verify the tagged version
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag equals the package version
        run: |
          python - <<'PY'
          import os
          import runpy
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = runpy.run_path("src/shockharness/version.py")["__version__"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match src/shockharness/version.py ({version})")
          print(f"tag {tag} matches version {version}")
          PY
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the artifacts carry the tagged version
        run: |
          ls -l dist
          test -f "dist/shockharness-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          test -f "dist/shockharness-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Install the wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          test "$(/tmp/clean/bin/shockharness version)" = "shockharness ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shockharness/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token input: the action exchanges the job's OIDC token for a short-lived
        # PyPI credential for the publisher registered in docs/releasing.md.
