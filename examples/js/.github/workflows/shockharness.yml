name: ShockHarness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shockharness:
    # Pin the workflow to a release tag or a full commit SHA; the ref pins the workflow
    # only. The analyzer version is the input below and is the pin Dependabot does not
    # touch: bump it on purpose.
    uses: evolvingstuff/ShockHarness/.github/workflows/check.yml@v0.11.0
    permissions:
      contents: read
      security-events: write
    with:
      shockharness-version: "0.11.0"
      config: .shockharness.toml
      base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
