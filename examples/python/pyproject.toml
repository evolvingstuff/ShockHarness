[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "example-service"
version = "0.1.0"
description = "A tiny Python consumer of ShockHarness (example only)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The analyzer pin lives here, where Dependabot's pip ecosystem can bump it.
# Keep `shockharness-version` in .github/workflows/shockharness.yml equal to it.
dev = [
  "shockharness==0.6.0",
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/example_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
