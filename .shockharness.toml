# ShockHarness analyzing itself. Every exemption below is deliberate and reported.
# See agent_code_integrity_project_spec.md section 15.5 for the bootstrapping policy.

[tool.shockharness]
profile = "strict"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "evals/*.py", "evals/behavior/*.py"]
exclude = ["**/.venv/**", "**/node_modules/**", "**/dist/**", "**/build/**", "tests/fixtures/**", "evals/tasks/**", "evals/behavior/cases/**", "evals/behavior/review_queue/**", "evals/under-the-gate/round*/**"]
parse_errors = "fail"

# File roles: the bundled defaults, except that this repository has no tooling
# configuration among the analyzed files. Its one conftest.py (tests/conftest.py) holds
# pytest fixtures and test helpers, so it is test code (tests/**), not config.
[tool.shockharness.file_roles]
config = []

[tool.shockharness.rules.magic_numbers]
enabled = true
allowed_values = [0, 1]
allow_unary_negative_one = false
exclude_configuration_files = false

[tool.shockharness.rules.exceptions]
enabled = true
mode = "boundary_whitelist"

# Declared boundaries where the tool meets the outside world. Each converts the
# named failure into a typed analyzer diagnostic; none may swallow it.
# TYPE001: configuration, report and cache values are dynamic TOML/JSON data, typed
# Mapping[str, Any] by design (validated by schema.py, not by the type checker); listing
# every Any would bury the casts and type: ignore comments, which stay reported.
[tool.shockharness.rules.types]
report_any = false

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/config.py"
language = "python"
exception = "OSError"
reason = "Reading a configuration file is I/O; failure becomes a ConfigError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/config.py"
language = "python"
exception = "tomllib.TOMLDecodeError"
reason = "Config file content is external input; decode failure becomes a ConfigError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/config.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "Config file bytes are external input; non-UTF-8 becomes a ConfigError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/skills/freshness.py"
language = "python"
exception = "shockharness.errors.UsageError"
reason = "A project's skills manifest is external input; one that cannot be read becomes the skills notice telling the agent how to reinstall, never a failed check"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/godot_project.py"
language = "python"
exceptions = ["OSError", "UnicodeDecodeError"]
reason = "Reading a Godot project's scene and resource files; an unreadable one is recorded as a problem, and the dead-code rules then do not judge C# (G3)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/contracts/catalog.py"
language = "python"
exceptions = ["OSError", "UnicodeDecodeError"]
reason = "Reading a project file the property-contracts catalog names; an unreadable one makes the reference unresolved, a configuration error that names it"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/contracts/catalog.py"
language = "python"
exception = "SyntaxError"
reason = "A project file the catalog names is external source; one that does not parse makes the reference unresolved, a configuration error that names it"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/accepted_policy.py"
language = "python"
exception = "shockharness.errors.ConfigError"
reason = "VERIFY003 loads the configuration a person last accepted, from a commit; an invalid one becomes an unknown finding naming the error, never a crash or a pass (spec 21.1 decision 35)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/policy_integrity.py"
language = "python"
exception = "OSError"
reason = "VERIFY003 reads policy files of an exported revision; an unreadable one is recorded under coverage read_errors, never a pass"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/policy_integrity.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "A policy file of an exported revision is external bytes; undecodable text is recorded as a read error"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/policy_integrity.py"
language = "python"
exception = "shockharness.errors.ConfigError"
reason = "A revision's committed configuration is external input; an invalid one makes the VERIFY003 comparison unknown, never a crash or a pass"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/policy_integrity.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "Candidate baseline files of the analyzed tree are external JSON; a file that is not JSON is not a baseline"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/tool_configs.py"
language = "python"
exception = "tomllib.TOMLDecodeError"
reason = "ruff and pyproject settings of a revision are external input; invalid TOML makes the comparison unknown"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/tool_configs.py"
language = "python"
exception = "configparser.Error"
reason = "setup.cfg, tox.ini, .flake8, pytest.ini and .coveragerc are external input; an invalid file makes the comparison unknown"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/tool_configs.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "An .eslintrc is external input and may be YAML; a file that is not JSON makes the comparison unknown"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/rules/tool_configs.py"
language = "python"
exception = "ValueError"
reason = "pytest addopts is external text; shlex rejects unbalanced quotes, and such a value is split on whitespace instead"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/analysis.py"
language = "python"
exception = "OSError"
reason = "Reading analyzed files is I/O; failure becomes a per-file read_error status, never a pass"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/analysis.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "Analyzed source is external bytes; undecodable input becomes a decode_error file status"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/ir/python.py"
language = "python"
exception = "SyntaxError"
reason = "ast.parse and tokenize on external source; failure becomes a ParseFailure fact feeding the parse_errors gate"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/ir/python.py"
language = "python"
exception = "ValueError"
reason = "ast.parse raises ValueError for NUL bytes on 3.11 and tokenize raises UnicodeDecodeError (a ValueError) on some CR sequences; both become a ParseFailure"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/ir/python.py"
language = "python"
exception = "RecursionError"
reason = "ast.parse cannot build a tree nested past the host interpreter's limit (CPython 3.11 counts the caller's frames); the file becomes a ParseFailure, like syntax the host cannot parse, instead of an internal error"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/ir/python.py"
language = "python"
exception = "tokenize.TokenError"
reason = "Comment extraction tokenizes external source; failure becomes a ParseFailure fact"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cli.py"
language = "python"
exception = "OSError"
reason = "Writing the report, baseline, or init file to a user path is I/O; failure becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/gating/baseline.py"
language = "python"
exception = "OSError"
reason = "Reading a user-supplied baseline file is I/O; failure becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/gating/baseline.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "Baseline file bytes are external input; non-UTF-8 becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/gating/baseline.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "Baseline file content is external input; malformed JSON becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/history/git.py"
language = "python"
exception = "subprocess.CalledProcessError"
reason = "The git subprocess is the outside world; a non-zero exit (not a repository, unknown revision) becomes a GitResult error: diff/gate turn it into a UsageError (exit 2), history metrics into status = unavailable"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/history/git.py"
language = "python"
exception = "OSError"
reason = "Launching git can fail when the binary is absent (FileNotFoundError) or cannot be executed; the failure becomes a GitResult error, never a silent empty history"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/history/git.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "git output is external bytes; undecodable output becomes a GitResult error"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/skills/install.py"
language = "python"
exception = "OSError"
reason = "Reading and writing skill files and the manifest in the user's chosen destination is I/O; failure becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/skills/install.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "Skills manifest bytes are external input; non-UTF-8 becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/skills/install.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "Skills manifest content is external input; malformed JSON becomes a UsageError (exit 2)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/hook.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "An agent hook's stdin is external input; malformed JSON becomes a notice to the user (exit 1), never feedback to the agent"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/hook_state.py"
language = "python"
exception = "OSError"
reason = "The edit hook reads the files an agent changed and keeps its own state and run log in the cache directory; every failure is recorded and written to the run log (a file that cannot be read is not analyzed, a state that cannot be read is none)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/hook_state.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "The hook's state file is bytes on disk; undecodable state is recorded and ignored, so changed files are analyzed again"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/hook_state.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "The hook's state file may be corrupt; a corrupt state is recorded and ignored, so changed files are analyzed again"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cache/store.py"
language = "python"
exception = "OSError"
reason = "The cache directory is I/O (reading an index or entry, creating the directory, writing a temporary file, renaming it, removing a stale entry); every failure is counted under coverage.cache.errors, described once in coverage.cache.problems, and the file is analyzed afresh; the cache never fails a run or yields a partial result"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cache/store.py"
language = "python"
exception = "UnicodeDecodeError"
reason = "Cache files are external bytes; a non-UTF-8 index or entry is counted and described under coverage.cache and ignored"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cache/store.py"
language = "python"
exception = "json.JSONDecodeError"
reason = "Cache files are external content; a malformed index or entry is counted and described under coverage.cache and ignored (a corrupt index rebuilds the cache)"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cache/store.py"
language = "python"
exception = "shockharness.cache.codec.CacheEntryError"
reason = "An entry whose shape does not match the current tool (schema drift, hand edits) is counted and described under coverage.cache and ignored; the file is analyzed afresh"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cli.py"
language = "python"
exception = "shockharness.errors.ShockHarnessError"
reason = "Process boundary: typed configuration and usage errors print one line and exit 2"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/shockharness/cli.py"
language = "python"
exception = "Exception"
reason = "Process boundary: an unexpected internal failure prints its full traceback and exits 3 instead of Python's default 1; nothing is hidden"

[tool.shockharness.rules.defaults]
enabled = true
function_parameters = "forbid"
dataclass_fields = "forbid"
missing_value_fallbacks = "forbid"
truthiness_fallbacks = "review"
nullish_fallbacks = "forbid"
configuration_fallbacks = "forbid"

[tool.shockharness.rules.magic_strings]
enabled = true
mode = "review"

[tool.shockharness.complexity]
enabled = true
cognitive_warn = 15
cyclomatic_warn = 15
max_nesting_warn = 4

[tool.shockharness.gates]
new_hard_violations = "fail"
legacy = "baseline"
complexity_regressions = "warn"

[[tool.shockharness.overrides]]
paths = ["src/shockharness/ir/javascript_nodes.py"]
disable = ["CPLX006"]
reason = "The tree-sitter names the JavaScript IR uses, one constant per line in two classes (Kind, Field); a list of names, not a long unit"

[[tool.shockharness.overrides]]
paths = ["src/shockharness/ir/csharp_nodes.py"]
disable = ["CPLX006"]
reason = "The tree-sitter names the C# IR uses, one constant per line in two classes (Kind, Field); a list of names, not a long unit"

[[tool.shockharness.overrides]]
roles = ["test"]
disable = ["MAGIC001", "DEF001"]
reason = "Test code encodes literal expected outputs and pytest fixture signatures"

[[tool.shockharness.overrides]]
paths = ["evals/run_evals.py", "evals/behavior/run.py"]
disable = ["MAGIC001"]
reason = "The eval runner is stdlib-only by design (it scores the analyzer from outside), so it cannot import shockharness.constants and holds its one JSON indent constant itself"

# DEAD001, DEAD002 (decision 38). The contracts runtime is a library other projects install
# and call (`shockharness contracts install`); nothing in this repository calls its API.
[tool.shockharness.rules.dead_code]
enabled = true
entry_points = ["src/shockharness/contracts/runtime/contracts.py::*"]

# DUP001, DUP002 (decision 39). Parallel implementations for different syntax trees are
# told apart by their annotated types; the copies kept on purpose carry a reasoned
# suppression where they are defined.
[tool.shockharness.rules.duplicates]
enabled = true

# This repository ships the skills (src/shockharness/skills) rather than installing them,
# so `check` does not suggest `skills install` here.
[tool.shockharness.skills]
notify_missing = false
