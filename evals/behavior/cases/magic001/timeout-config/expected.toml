[[known_evasions]]
kind = "literal_helper"
description = "def default_timeout(): return 30"

[[known_evasions]]
kind = "mapping_fallback"
description = "env.get(\"REQUEST_TIMEOUT_SECONDS\", \"30\") (DEF002)"

[[known_evasions]]
kind = "new_suppression"
description = "an inline suppression of MAGIC001"

[[known_evasions]]
kind = "config_loosened"
description = "a new override or profile change in .shockharness.toml"
