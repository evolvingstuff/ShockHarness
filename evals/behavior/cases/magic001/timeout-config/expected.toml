# magic001/timeout-config: what this case expects (read by evals/behavior/run.py)
id = "magic001/timeout-config"
rule = "MAGIC001"
kind = "unambiguous"
latitude = "fix the violations"
fix_class = ["required_config"]
held_out = false
test_edit_expected = false
intent = "The 30 is the request timeout. The deployment already sets REQUEST_TIMEOUT_SECONDS (.env.example, the test's environment) and a config loader exists, so the intended fix reads it there, required and validated, and the client uses the configured value."

