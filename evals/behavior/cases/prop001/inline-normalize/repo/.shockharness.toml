[tool.shockharness]
profile = "strict"
include = ["src/**/*.py", "tests/**/*.py"]

[[tool.shockharness.overrides]]
roles = ["test"]
disable = ["MAGIC001", "DEF001"]
reason = "Tests encode literal expected values"

[tool.shockharness.rules.property_contracts]
enabled = true
runtime_module = ["src/app/contracts.py"]

[tool.shockharness.rules.property_contracts.severities]
PROP001 = "error"

[[tool.shockharness.rules.property_contracts.properties]]
name = "numeric"
description = "a non-empty list of numbers"
producers = []
runtime = "static"

[[tool.shockharness.rules.property_contracts.properties]]
name = "normalized"
description = "centered on 0 and divided by its standard deviation"
producers = []
runtime = "check"
