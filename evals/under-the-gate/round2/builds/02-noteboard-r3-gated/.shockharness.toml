[tool.shockharness]
profile = "strict"
include = ["**/*.py", "**/*.js", "**/*.mjs"]
exclude = ["**/node_modules/**", ".claude/**", "**/.venv/**"]

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/storage.js"
language = "javascript"
exception = "SyntaxError"
reason = "JSON.parse of text read from localStorage, which is external input; a parse failure becomes a LOAD_UNREADABLE result that the board reports to the user"
