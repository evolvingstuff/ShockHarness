<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noteboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1d1d1f; background: #f5f5f7; }
    body { margin: 0; padding: 2rem 1rem 6rem; }
    main { max-width: 40rem; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid #c7c7cc; background: #fff; padding: .4rem .8rem; }
    button.danger { background: #d70015; border-color: #d70015; color: #fff; }
    .icon-button { display: inline-flex; padding: .3rem; border: none; background: transparent; color: #6e6e73; }
    .icon-button:hover, .icon-button:focus-visible { background: #e5e5ea; color: #1d1d1f; }
    .icon-button[aria-pressed="true"] { color: #0071e3; }
    #notes { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
    #notes.empty::before { content: "No notes yet."; color: #6e6e73; }
    .note { position: relative; background: #fff; border-radius: 10px; padding: .75rem 2.75rem .75rem .75rem; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
    .note.pinned { border-left: 4px solid #0071e3; }
    .note.editing { outline: 2px solid #0071e3; }
    .note-body { white-space: pre-wrap; min-height: 1.5em; cursor: text; }
    .note-body.placeholder { color: #a1a1a6; }
    .note-editor { width: 100%; min-height: 5em; box-sizing: border-box; font: inherit; border: none; resize: vertical; outline: none; }
    .note-toolbar { position: absolute; top: .4rem; right: .4rem; display: flex; flex-direction: column; gap: .1rem; }
    .toasts { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); display: grid; gap: .5rem; z-index: 10; }
    .toast { display: flex; align-items: center; gap: .75rem; background: #1d1d1f; color: #fff; padding: .5rem .5rem .5rem 1rem; border-radius: 8px; }
    .toast-error { background: #d70015; }
    .toast .icon-button { color: inherit; }
    .modal { border: none; border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 30px rgb(0 0 0 / .2); }
    .modal::backdrop { background: rgb(0 0 0 / .3); }
    .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Notes</h1>
      <button type="button" id="add-note">New note</button>
    </header>
    <ul id="notes" aria-label="Notes"></ul>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
