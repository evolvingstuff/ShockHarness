[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contactclean"
version = "0.1.0"
description = "Clean a CSV export of contacts"
requires-python = ">=3.11"

[project.scripts]
contactclean = "contactclean.cli:main"

[tool.setuptools]
packages = ["contactclean"]
