[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contactclean"
version = "0.1.0"
description = "Clean a CSV export of contacts and report the rows it could not use"
requires-python = ">=3.11"

[project.scripts]
contactclean = "contactclean.cli:main"

[tool.setuptools.package-data]
contactclean = ["phone_plans.json"]
