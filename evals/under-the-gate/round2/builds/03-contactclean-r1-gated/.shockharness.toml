[tool.shockharness]
profile = "strict"
include = ["**/*.py", "**/*.js", "**/*.mjs"]
exclude = ["**/node_modules/**", ".claude/**", "**/.venv/**"]

[[tool.shockharness.rules.exceptions.boundaries]]
path = "contactclean/csvio.py"
language = "python"
exceptions = ["OSError", "UnicodeDecodeError", "csv.Error"]
reason = "Reading, decoding and parsing the user's input file; each failure becomes a typed InputUnreadable"

[[tool.shockharness.rules.exceptions.boundaries]]
path = "contactclean/cli.py"
language = "python"
exception = "contactclean.errors.InputUnreadable"
reason = "Process boundary: an unreadable input becomes exit status 2 (SPEC.md) via SystemExit, with the message on stderr"
