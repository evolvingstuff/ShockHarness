[tool.shockharness]
profile = "strict"
include = ["**/*.py", "**/*.js", "**/*.mjs"]
exclude = ["**/node_modules/**", ".claude/**", "**/.venv/**"]

[[tool.shockharness.rules.exceptions.boundaries]]
path = "src/storage.js"
language = "javascript"
exception = "SyntaxError"
reason = "Decoding localStorage text, which is external input; a syntax error becomes an 'unreadable' result that the board reports to the user"
