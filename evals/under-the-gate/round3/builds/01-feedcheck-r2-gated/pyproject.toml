[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedcheck"
version = "0.1.0"
description = "Check that a set of JSON feeds is healthy and write a report"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
feedcheck = "feedcheck.cli:entry_point"

[tool.setuptools]
packages = ["feedcheck"]
