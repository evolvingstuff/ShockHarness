[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feedcheck"
version = "1.0.0"
description = "Check the health of JSON feeds and write a report."
requires-python = ">=3.11"

[project.scripts]
feedcheck = "feedcheck.cli:main"

[tool.setuptools]
packages = ["feedcheck"]
