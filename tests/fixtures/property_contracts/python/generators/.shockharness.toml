[tool.shockharness]
profile = "strict"
include = ["app/**/*.py"]

[tool.shockharness.rules.property_contracts]
enabled = true
# A package name: a project that packages the runtime file itself.
runtime_module = ["contracts_runtime"]

[[tool.shockharness.rules.property_contracts.properties]]
name = "redacted"
description = "text with addresses masked"
producers = []
runtime = "static"

[[tool.shockharness.rules.property_contracts.sinks]]
language = "python"
callee = "app.provider.send:0"
requires = ["redacted"]
reason = "nothing reaches the model provider unredacted"
