[tool.shockharness]
profile = "strict"
include = ["static/**/*.js", "tests/**/*.js"]

[tool.shockharness.rules.property_contracts]
enabled = true
# The runtime file need not exist or be analyzed: only its path is needed.
runtime_module = ["static/js/vendor/contracts.js"]

[[tool.shockharness.rules.property_contracts.properties]]
name = "numeric"
description = "a numeric series"
producers = []
runtime = "static"

[[tool.shockharness.rules.property_contracts.properties]]
name = "normalized"
description = "centered and divided by its standard deviation"
producers = ["static/js/stats.js:normalize"]
runtime = "check"

[[tool.shockharness.rules.property_contracts.sinks]]
language = "javascript"
callee = "fetch:1"
requires = ["normalized"]
reason = "only normalized series are uploaded"
