[tool.shockharness]
profile = "strict"
include = ["src/**/*.ts"]

[tool.shockharness.rules.property_contracts]
enabled = true
runtime_module = ["src/vendor/contracts.js"]

[[tool.shockharness.rules.property_contracts.properties]]
name = "numeric"
description = "a numeric series"
producers = []
runtime = "static"

[[tool.shockharness.rules.property_contracts.properties]]
name = "normalized"
description = "centered and divided by its standard deviation"
producers = ["src/stats.ts:normalize"]
runtime = "check"
